<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Latte Art Workshop</title>
<meta name="description" content="BUNCA.ACADEMY · Latte Art Workshop: Milch aufschäumen und Latte Art gießen, mit Zeitlupe, interaktiven Grafiken und Quiz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen cinema stage. One scene at a time; dark "Kino" scenes for film,
   greige "Studio" scenes (the deck's own colour) for explanations. HUD on top, dock at the bottom. */
:root{
  --night:#120f0d;      /* espresso black, cinema ground */
  --roast:#1d1814;      /* raised dark surface */
  --greige:#b0a7a1;     /* BUNCA.ACADEMY slide colour */
  --ink:#262626;        /* deck text */
  --milk:#f3eee8;       /* foam white */
  --peach:#f8cbad;      /* deck accent */
  --brown:#7a5238;      /* deck brown */
  --crema:#c99a6b;      /* crema */
  --steel:#a39a93;      /* muted on dark */
  --display:"Jost","Century Gothic","Futura","Avenir Next",system-ui,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --hud-h:58px; --dock-h:64px;
  --ease:cubic-bezier(.2,.7,.1,1);
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--milk);font-family:var(--display);font-size:clamp(15px,1.05vw + 6px,20px);line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-appearance:none;appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--peach);outline-offset:3px;border-radius:6px}
img,video{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;font-weight:400}

/* ---------- scene tones ---------- */
.scene{--bg:var(--night);--fg:var(--milk);--mute:#b3aaa3;--acc:var(--peach);--card:rgba(243,238,232,.06);--line:rgba(243,238,232,.16);--strong:var(--milk)}
.scene.light{--bg:var(--greige);--fg:var(--ink);--mute:#45403b;--acc:var(--brown);--card:rgba(38,38,38,.075);--line:rgba(38,38,38,.2);--strong:#1a1715}
body{--hud-fg:var(--milk);--hud-mute:#b3aaa3;--hud-line:rgba(243,238,232,.18);--hud-bg:18,15,13}
body[data-tone="light"]{--hud-fg:var(--ink);--hud-mute:#45403b;--hud-line:rgba(38,38,38,.22);--hud-bg:176,167,161}

/* ---------- stage & transitions ---------- */
#stage{position:fixed;inset:0;overflow:hidden;background:var(--night)}
.scene{position:absolute;inset:0;background:var(--bg);color:var(--fg);visibility:hidden;opacity:0;z-index:0}
.scene.is-active{visibility:visible;opacity:1;z-index:2;animation:sceneIn .95s var(--ease) both}
.scene.is-active.back{animation-name:sceneInBack}
.scene.is-leaving{visibility:visible;opacity:1;z-index:1;animation:sceneOut .75s ease both}
@keyframes sceneIn{from{opacity:0;transform:scale(1.03) translateX(1.5%)}to{opacity:1;transform:none}}
@keyframes sceneInBack{from{opacity:0;transform:scale(1.03) translateX(-1.5%)}to{opacity:1;transform:none}}
@keyframes sceneOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.985)}}
.inner{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
  padding-top:calc(var(--hud-h) + env(safe-area-inset-top,0px) + 14px);
  padding-bottom:calc(var(--dock-h) + env(safe-area-inset-bottom,0px) + 14px);
  padding-left:max(clamp(16px,5vw,80px),env(safe-area-inset-left,0px));
  padding-right:max(clamp(16px,5vw,80px),env(safe-area-inset-right,0px));
  display:grid;align-content:center}
.rv{opacity:0}
.is-active .rv{animation:rv 1s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms + 260ms)}
@keyframes rv{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.is-active .rv-img{animation:rvImg 1.4s var(--ease) both;animation-delay:calc(var(--d,0) * 90ms + 200ms)}
@keyframes rvImg{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}

/* light leak for chapter cuts */
#leak{position:fixed;inset:-20%;z-index:40;pointer-events:none;opacity:0;
  background:radial-gradient(40% 60% at 30% 50%,rgba(248,203,173,.55),transparent 70%),radial-gradient(35% 50% at 70% 40%,rgba(201,154,107,.45),transparent 70%)}
#leak.go{animation:leak 1.3s ease-out}
@keyframes leak{0%{opacity:0;transform:translateX(-30%)}25%{opacity:.9}100%{opacity:0;transform:translateX(30%)}}
body[data-video="1"] #grain{display:none}
#grain{position:fixed;inset:-50%;z-index:39;pointer-events:none;opacity:.045;animation:grain .8s steps(5) infinite;will-change:transform}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}
.vignette{position:fixed;inset:0;z-index:38;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 60%,rgba(0,0,0,.35))}
body[data-tone="light"] .vignette{opacity:.35}

/* ---------- HUD ---------- */
.hud{position:fixed;top:0;left:0;right:0;z-index:30;height:calc(var(--hud-h) + env(safe-area-inset-top,0px));
  padding-top:env(safe-area-inset-top,0px);padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:16px;color:var(--hud-fg);transition:color .6s;background:linear-gradient(to bottom,rgba(var(--hud-bg),.85) 40%,rgba(var(--hud-bg),0))}
.mark{font-size:15px;letter-spacing:.02em;white-space:nowrap}
.mark b{font-weight:600}.mark span{font-weight:300}
.hud-where{flex:1;min-width:0;font-size:13px;color:var(--hud-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .6s}
.hud-where em{font-style:normal;color:var(--hud-fg)}
.hud-btns{display:flex;gap:4px}
.hbtn{height:38px;min-width:38px;padding:0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--hud-fg);border:1px solid var(--hud-line);transition:background .2s,border-color .2s}
.hbtn:hover{background:rgba(127,127,127,.14)}
.hbtn svg{width:16px;height:16px;flex:none}
.hbtn[aria-pressed="true"]{border-color:var(--peach);color:var(--hud-fg)}
.hbtn .lbl{display:inline}
@media (max-width:720px){.hbtn .lbl{display:none}.hbtn{padding:0 10px}.hud-where{display:none}}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--dock-h) + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(clamp(16px,3vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,3vw,40px),env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;color:var(--hud-fg);background:linear-gradient(to top,rgba(var(--hud-bg),.98) 62%,rgba(var(--hud-bg),0))}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--hud-line);display:grid;place-items:center;flex:none;transition:background .2s}
.nav:hover{background:rgba(127,127,127,.16)}
.nav svg{width:18px;height:18px}
.nav.next{background:var(--peach);color:var(--ink);border-color:var(--peach)}
.nav.next:hover{background:#fbd9c3}
.prog{flex:1;display:flex;gap:3px;align-items:center;height:44px;min-width:0}
.prog button{flex:1;height:44px;position:relative;min-width:0}
.prog button::after{content:"";position:absolute;left:0;right:0;top:50%;height:3px;margin-top:-1.5px;border-radius:2px;background:var(--hud-line);transition:background .3s,height .3s}
.prog button.done::after{background:var(--hud-mute)}
.prog button.cur::after{background:var(--peach);height:5px;margin-top:-2.5px}
.prog button.ch1::before,.prog button.ch2::before{content:"";position:absolute;left:0;top:12px;width:1px;height:20px;background:var(--hud-line)}
.count{font-family:var(--mono);font-size:12px;color:var(--hud-mute);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- typography ---------- */
.kicker{display:flex;align-items:baseline;gap:.5em;font-size:clamp(20px,1.6vw + 8px,34px);font-weight:300;color:var(--fg)}
.kicker .n{color:var(--peach);font-weight:300}
.scene.light .kicker .n{color:#fbe3d3;text-shadow:0 1px 0 rgba(0,0,0,.08)}
.title{font-size:clamp(28px,2.6vw + 12px,60px);font-weight:500;line-height:1.08;letter-spacing:-.01em;color:var(--strong)}
.lead{font-size:clamp(17px,.9vw + 10px,24px);max-width:36ch;color:var(--fg)}
.label{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:500;color:var(--mute)}
.mute{color:var(--mute)}
.serif{font-family:var(--serif);font-style:italic;font-weight:400}
.big-num{font-weight:300;color:var(--acc);font-size:clamp(34px,3vw + 10px,64px);line-height:1;font-variant-numeric:tabular-nums}
.scene.light .big-num{color:var(--brown)}
.stack{display:flex;flex-direction:column;gap:clamp(12px,1.6vw,22px);min-width:0}
.card{background:var(--card);border-radius:16px;padding:clamp(14px,1.4vw,22px) clamp(16px,1.6vw,26px);min-width:0}
.notes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em;font-size:clamp(16px,.8vw + 10px,22px)}
.notes li{display:flex;gap:.7em}
.notes li::before{content:"";flex:none;width:.9em;height:1px;background:var(--acc);margin-top:.75em}
.why{border-left:2px solid var(--acc);padding:2px 0 2px 16px;font-size:clamp(14px,.5vw + 10px,18px);color:var(--mute);max-width:52ch}
.why b{color:var(--fg);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,4vw,72px);align-items:center}
.split.rev{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.frame{border-radius:18px;overflow:hidden;background:#000;position:relative}
.frame img{width:100%;height:100%;object-fit:cover}
.media-h{max-height:calc(100dvh - var(--hud-h) - var(--dock-h) - 70px)}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px;min-height:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 22px;border-radius:999px;font-size:16px;font-weight:500;border:1px solid var(--line);transition:transform .2s var(--ease),background .2s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--peach);color:var(--ink);border-color:var(--peach)}
.btn svg{width:18px;height:18px}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .split,.split.rev{grid-template-columns:minmax(0,1fr)}
  .inner{align-content:start}
  .media-h{max-height:62vh}
}

/* ---------- start ---------- */
#s-start .inner{grid-template-columns:minmax(0,1fr) auto;gap:clamp(20px,5vw,90px);align-items:center}
.start-bg{position:absolute;inset:0;overflow:hidden}
.start-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.15)}
.hero-title{font-size:clamp(64px,10vw,190px);font-weight:300;line-height:.9;letter-spacing:-.02em}
.hero-title span{display:inline-block}
.is-active .hero-title span{animation:letter 1.2s var(--ease) both;animation-delay:calc(var(--i) * 55ms + 300ms)}
@keyframes letter{from{opacity:0;transform:translateY(.35em) rotate(4deg)}to{opacity:1;transform:none}}
.agenda-mini{display:flex;flex-direction:column;gap:6px;font-size:clamp(20px,1.6vw + 8px,32px);font-weight:300}
.agenda-mini .n{color:var(--peach);margin-right:.4em}
.start-actions{display:flex;flex-wrap:wrap;gap:12px}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(20px,1.4vw + 10px,30px);color:var(--peach)}
.hero-video{height:min(74vh,760px);aspect-ratio:9/16;border-radius:22px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.hero-video video,.hero-video img{width:100%;height:100%;object-fit:cover}
.tc{position:absolute;left:12px;bottom:12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--milk);background:rgba(0,0,0,.45);padding:4px 8px;border-radius:6px}
@media (max-width:860px),(max-aspect-ratio:1/1){#s-start .inner{grid-template-columns:minmax(0,1fr)}.hero-video{height:auto;width:min(100%,360px);justify-self:start}}

/* ---------- agenda ---------- */
.agenda{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(14px,2vw,28px)}
.ag{position:relative;border-radius:22px;overflow:hidden;min-height:clamp(260px,52vh,560px);text-align:left;display:flex;flex-direction:column;justify-content:flex-end;padding:clamp(18px,2.4vw,36px);isolation:isolate}
.ag video,.ag img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2;transition:transform 1.2s var(--ease)}
.ag::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(18,15,13,.05) 30%,rgba(18,15,13,.9))}
.ag:hover video,.ag:hover img{transform:scale(1.05)}
.ag .n{font-size:clamp(56px,6vw,110px);font-weight:300;color:var(--peach);line-height:.9}
.ag h3{font-size:clamp(30px,3vw,56px);font-weight:400;line-height:1}
.ag p{color:#d8d0c9;margin-top:10px;font-size:15px;max-width:40ch}
@media (max-width:860px){.agenda{grid-template-columns:minmax(0,1fr)}.ag{min-height:240px}}

/* ---------- chapter cards ---------- */
.tri{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr)}
.tri video,.tri img{width:100%;height:100%;object-fit:cover}
.chap-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,15,13,.92) 0%,rgba(18,15,13,.6) 45%,rgba(18,15,13,.25))}
.chap .inner{align-content:center}
.chap-n{font-size:clamp(120px,22vw,380px);font-weight:300;line-height:.8;color:transparent;-webkit-text-stroke:1.5px var(--peach);letter-spacing:-.04em}
.chap-t{font-size:clamp(56px,8vw,150px);font-weight:300;line-height:.95;margin-top:-.3em}
.chap-sub{font-family:var(--serif);font-style:italic;font-size:clamp(22px,1.8vw + 8px,38px);color:var(--peach);margin-top:18px}
.is-active .chap-n{animation:chapN 1.6s var(--ease) both .15s}
@keyframes chapN{from{opacity:0;letter-spacing:.2em}to{opacity:1;letter-spacing:-.04em}}

/* ---------- diagrams (svg) ---------- */
.diagram{width:100%;height:auto;overflow:visible}
.d-stroke{fill:none;stroke:currentColor;stroke-width:2}
.dash{stroke-dasharray:5 6}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.6vw,22px)}
.duo .card{display:flex;flex-direction:column;gap:10px}
.duo .card svg{width:56px;height:56px}
.goal{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:clamp(18px,1vw + 10px,26px)}
.goal .label{color:var(--fg)}
@media (max-width:520px){.duo{grid-template-columns:minmax(0,1fr)}}

/* pitcher fill */
.pitchers{display:flex;align-items:flex-end;gap:clamp(18px,3vw,48px);justify-content:center}
.pitcher svg{display:block}
.milkfill{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform 2.2s var(--ease) .5s}
.is-active .milkfill{transform:scaleY(1)}
.notch-l{opacity:0;transition:opacity .6s 2.3s}
.is-active .notch-l{opacity:1}

/* three states */
.zoomer{position:relative;overflow:hidden;border-radius:18px;aspect-ratio:4/3;background:#000;width:min(100%,calc((100dvh - var(--hud-h) - var(--dock-h) - 190px) * 1.333))}
.zoomer img{width:100%;height:100%;object-fit:cover;transform-origin:var(--ox,50%) var(--oy,50%);transform:scale(var(--z,1));transition:transform 1.6s var(--ease),transform-origin 1.6s var(--ease)}
.subs{min-height:4.2em;display:grid}
.subs p{grid-area:1/1;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s var(--ease);font-size:clamp(18px,1vw + 10px,28px);max-width:44ch}
.subs p.on{opacity:1;transform:none;transition-delay:.35s}
.subs p b{color:var(--peach);font-weight:500}
.dots{display:flex;gap:8px}
.dots button{width:44px;height:28px;position:relative}
.dots button::after{content:"";position:absolute;left:6px;right:6px;top:12px;height:4px;border-radius:2px;background:var(--line)}
.dots button.on::after{background:var(--peach)}

/* phase 1 */
.p1{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,4vw,64px);align-items:center}
.p1-rows{display:flex;flex-direction:column;gap:12px}
.p1-row{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.p1-row:first-child{border-top:0}
.zz{display:flex;align-items:center;gap:3px;height:34px}
.zz i{width:4px;border-radius:2px;background:var(--brown);height:100%;transform:scaleY(.15);animation:zz .9s ease-in-out infinite;animation-delay:calc(var(--k) * -70ms)}
@keyframes zz{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
/* scenes that are not on screen do no animation work */
.scene:not(.is-active):not(.is-leaving) *{animation-play-state:paused!important}
.timer{position:relative;height:34px;margin-top:6px}
.timer .bar{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:3px;background:var(--line)}
.timer .rng{position:absolute;top:14px;height:6px;border-radius:3px;background:rgba(122,82,56,.45);left:20%;right:0}
.timer .run{position:absolute;top:14px;height:6px;border-radius:3px;background:var(--brown);left:0;width:0}
.is-active .timer .run{animation:run 3s linear infinite 1s}
@keyframes run{0%{width:0}60%{width:60%}100%{width:60%}}
.timer .tick{position:absolute;top:24px;font-family:var(--mono);font-size:11px;color:var(--mute);transform:translateX(-50%)}
.lance-ring{transform-box:fill-box;transform-origin:center;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(2.6);opacity:0}}
.bub{animation:bub 2.4s ease-in infinite;opacity:0}
@keyframes bub{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:.9}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(1)}}
.lance-path{stroke-dasharray:4 6;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-20}}
@media (max-width:860px),(max-aspect-ratio:1/1){.p1{grid-template-columns:minmax(0,1fr)}.p1-row{grid-template-columns:minmax(0,1fr);gap:6px}}

/* before/after */
.ba{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;--x:50%;width:min(100%,calc(100vh - var(--hud-h) - var(--dock-h) - 80px));width:min(100%,calc(100dvh - var(--hud-h) - var(--dock-h) - 80px));touch-action:pan-y}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ba .top{clip-path:inset(0 calc(100% - var(--x)) 0 0)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba .handle{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:var(--milk);pointer-events:none}
.ba .handle::after{content:"";position:absolute;top:50%;left:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--milk);box-shadow:0 6px 24px rgba(0,0,0,.4)}
.ba .handle svg{position:absolute;top:50%;left:50%;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:1;color:var(--ink)}
.ba .tag{position:absolute;top:14px;padding:6px 12px;border-radius:999px;background:rgba(18,15,13,.7);font-size:13px;pointer-events:none}
.ba .tag.l{left:14px}.ba .tag.r{right:14px}
.warn{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.warn svg{width:28px;height:28px;color:var(--peach)}

/* phase 2 */
.p2{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(20px,4vw,64px);align-items:center}
.p2.wide{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}

/* ---------- trailer ---------- */

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rv{opacity:1}
  #grain{display:none}
}
</style>
</head>
<body>


<style>
.lock{position:fixed;inset:0;z-index:100;display:grid;place-items:center;color:var(--milk);overflow:auto;
  background:radial-gradient(70% 60% at 30% 20%,rgba(201,154,107,.22),transparent 70%),radial-gradient(60% 60% at 80% 90%,rgba(122,82,56,.28),transparent 70%),var(--night);
  padding:calc(env(safe-area-inset-top,0px) + 24px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px))}
.lock-card{position:relative;width:min(100%,420px);display:flex;flex-direction:column;gap:18px}
.lock-t{font-size:clamp(56px,14vw,96px);font-weight:300;line-height:.9;letter-spacing:-.02em}
.lock-s{color:#b3aaa3}
.pin{position:relative;height:64px;margin-top:8px}
.pin input{position:absolute;inset:0;width:100%;height:100%;opacity:.001;font-size:16px;border:0;caret-color:transparent;color:transparent;background:transparent}
.pin-dots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;height:100%;pointer-events:none}
.pin-dots i{border:1px solid rgba(243,238,232,.25);border-radius:14px;display:grid;place-items:center;transition:border-color .2s}
.pin-dots i.f::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--milk)}
.pin-dots i.c{border-color:var(--peach)}
.pin.bad{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.remember{display:flex;gap:10px;align-items:center;font-size:15px;color:#d8d0c9;min-height:44px;cursor:pointer}
.remember input{width:20px;height:20px;accent-color:var(--peach)}
#la-msg{min-height:1.4em;color:var(--peach);font-size:15px}
.lock .btn[disabled]{opacity:.5;cursor:default}
</style>
<div id="la-lock" class="lock" role="dialog" aria-label="PIN eingeben">
  <form class="lock-card" id="la-form" autocomplete="off" novalidate>
    <div class="mark"><b>BUNCA</b><b style="color:var(--peach)">.</b><span>ACADEMY</span></div>
    <h1 class="lock-t">Latte Art</h1>
    <p class="lock-s">Workshop · Zugang nur mit PIN</p>
    <label class="label" for="la-pin" style="color:#b3aaa3">PIN eingeben</label>
    <div class="pin" id="la-pinbox">
      <input id="la-pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" aria-describedby="la-msg">
      <div class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    </div>
    <label class="remember"><input type="checkbox" id="la-remember"> Auf diesem Gerät merken</label>
    <button class="btn pri" type="submit" id="la-go">Öffnen</button>
    <p id="la-msg" aria-live="polite"></p>
  </form>
</div>

<script>
(() => {
'use strict';
function boot() {
const DATA = JSON.parse(document.getElementById('la-data').textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>'

/* ---------------- pattern scenes ---------------- */
const PATTERNS = DATA.patterns;
for (const sc of $$('[data-pattern]')) {
  const k = sc.dataset.pattern, P = PATTERNS[k];
  sc.innerHTML = `
  <div class="cine-bg"><img src="${IMG(`img/bg-${k}.webp`)}" alt=""></div>
  <div class="inner">
    <div class="cine" data-cine data-pat="${k}" data-src="media/${k}.mp4" data-poster="${IMG(`img/poster-${k}.webp`)}" data-dur="${P.dur}" data-rate="1">
      <div class="cine-side">
        <div class="kicker rv" style="--d:0"><span class="n">02</span>Latte Art</div>

        <div class="rv" style="--d:3" data-slot="speeds"></div>
      </div>
      <div class="rv-img" style="--d:1" data-slot="frame"></div>
      <div class="goalpic rv" style="--d:4">
        <span class="label">Ziel</span>
        <div class="ring"><img src="${IMG(`img/${k}-fertig.webp`)}" alt="Fertiges Muster: ${P.name}"></div>
        <span class="time" data-slot="time">00.0 s</span>
      </div>
    </div>
  </div>`;
}

  ctx: null,

  milkFb.textContent = ok ? 'Richtig: Hafer steht ganz links. Dort ziehst du am längsten.' : 'Fast. Ganz links steht Hafer: dort ziehst du am längsten, beim Kokos ganz rechts am kürzesten.';
  milkReveal(); if (state.i === ids.indexOf('milchalternativen')) state.step = 1;
}));
$('#milk-reveal').addEventListener('click', () => { milkReveal(); milkFb.textContent = 'Von links nach rechts: Hafer, Vollmilch 3,5 %, laktosefrei, Kokos.'; state.step = 1; });

/* ---------------- quiz ---------------- */
const QUIZ = DATA.quiz;
const quiz = { i: 0, res: [] , el: $('#quiz') };
function quizRender() {
  const el = quiz.el;
  const prog = `<div class="qprog" aria-hidden="true">${QUIZ.map((_, k) => `<i class="${k < quiz.res.length ? (quiz.res[k] ? 'ok' : 'no') : k === quiz.i ? 'cur' : ''}"></i>`).join('')}</div>`;
  if (quiz.i >= QUIZ.length) {
    const n = quiz.res.filter(Boolean).length;
    const msg = n === QUIZ.length ? 'Alles richtig. Ab an die Maschine.' : n >= 7 ? 'Stark. Die Theorie sitzt, jetzt kommt die Praxis.' : n >= 4 ? 'Guter Anfang. Schau dir die markierten Szenen nochmal an.' : 'Noch mal durch die Szenen, dann klappt es.';
    const wrong = QUIZ.map((q, k) => quiz.res[k] ? null : q).filter(Boolean);
    el.innerHTML = `<div class="qhead"><span class="label">Quiz · Ergebnis</span>${prog}</div>
      <div class="score">${n}<span style="font-size:.4em;color:var(--mute)"> / ${QUIZ.length}</span></div>
      <p class="qtext">${msg}</p>
      ${wrong.length ? `<div class="stack" style="gap:8px"><span class="label">Nochmal ansehen</span><div style="display:flex;flex-wrap:wrap;gap:8px">${[...new Set(wrong.map(w => w.go))].map(g => `<button class="chip" data-goto="${g}">${scenes[ids.indexOf(g)].dataset.title}</button>`).join('')}</div></div>` : ''}
      <div class="qfoot"><button class="btn" id="q-again">Nochmal</button><button class="btn pri" data-action="next">Zum Abschluss</button></div>`;
    $('#q-again').addEventListener('click', () => { quiz.i = 0; quiz.res = []; quizRender(); });
    return;
  }
  const Q = QUIZ[quiz.i];
  el.innerHTML = `<div class="qhead"><span class="label">Quiz · Frage ${quiz.i + 1} von ${QUIZ.length}</span>${prog}</div>
    <p class="qtext">${Q.q}</p>
    <div class="opts">${Q.o.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${'ABC'[k]}</span><span>${o}</span></button>`).join('')}</div>
    <p class="explain" id="q-ex"></p>
    <div class="qfoot"><button class="btn pri" id="q-next" hidden>${quiz.i === QUIZ.length - 1 ? 'Ergebnis' : 'Nächste Frage'}</button><button class="chip" data-goto="${Q.go}" id="q-go" hidden>Szene ansehen</button></div>`;
  $$('.opt', el).forEach(b => b.addEventListener('click', () => {
    const k = +b.dataset.k, ok = k === Q.a;
    quiz.res[quiz.i] = ok;
    $$('.opt', el).forEach(x => { x.disabled = true; if (+x.dataset.k === Q.a) x.classList.add('ok'); });
    if (!ok) b.classList.add('no');
    $('#q-ex').innerHTML = (ok ? 'Richtig. ' : 'Nicht ganz. ') + Q.e;
    $('#q-next').hidden = false; $('#q-go').hidden = false; $('#q-next').focus({ preventScroll: true });
    if (ok) sfx.whoosh(.03);
  }));
  $('#q-next').addEventListener('click', () => { quiz.i++; quizRender(); });
}
quizRender();

/* ---------------- progress & overview ---------------- */
const prog = $('#prog');
prog.innerHTML = scenes.map((s, k) => {
  const first = k > 0 && s.dataset.ch !== scenes[k - 1].dataset.ch ? ' ch' + Math.min(2, +s.dataset.ch) : '';
  return `<button aria-label="${k + 1}: ${s.dataset.title}" title="${s.dataset.title}" data-k="${k}" class="${first}"></button>`;
}).join('');
$$('button', prog).forEach(b => b.addEventListener('click', () => go(+b.dataset.k)));
const ovCols = $('#ov-cols');
ovCols.innerHTML = [0, 1, 2, 3].map(ch => {
  const list = scenes.map((s, k) => [s, k]).filter(([s]) => +s.dataset.ch === ch);
  const head = ch === 1 ? '<span class="n">01</span>Milch' : ch === 2 ? '<span class="n">02</span>Latte Art' : ch === 0 ? 'Start' : 'Abschluss';
  return `<div><h3>${head}</h3><ol>${list.map(([s, k]) => `<li><button data-k="${k}"><span class="i">${String(k + 1).padStart(2, '0')}</span><span>${s.dataset.title}</span></button></li>`).join('')}</ol></div>`;
}).join('');
$$('button', ovCols).forEach(b => b.addEventListener('click', () => { closeOverview(); go(+b.dataset.k); }));
function openOverview() { $$('button', ovCols).forEach(b => b.classList.toggle('cur', +b.dataset.k === state.i)); $('#overview').hidden = false; $('#overview .close').focus(); }
function closeOverview() { $('#overview').hidden = true; }

/* ---------------- scene lifecycle ---------------- */
const hooks = {
  'drei-zustaende': { step: (sc, n) => zSet(sc, n) },
  'vier-schritte': { step: (sc, n) => $$('.st', sc).forEach(s => s.classList.toggle('on', +s.dataset.n <= Math.max(1, n))) },
  'phase-2': { enter: () => vx1.start(), leave: () => vx1.stop() },
  'power-tilt': { enter: () => vx2.start(), leave: () => vx2.stop() },
  'stift': { enter: () => { pen.on = true; penSize(); penLoop(); }, leave: () => { pen.on = false; cancelAnimationFrame(pen.raf); } },
  'milchalternativen': { step: (sc, n) => { if (n >= 1 && !milkq.classList.contains('revealed')) { milkReveal(); milkFb.textContent = 'Von links nach rechts: Hafer, Vollmilch 3,5 %, laktosefrei, Kokos.'; } } }
};
function setStep(n) {
  const sc = scenes[state.i], h = hooks[sc.dataset.id];
  state.step = n; if (h && h.step) h.step(sc, n);
}
let leakT;
function svgAnim(sc, on) { $$('svg', sc).forEach(g => { try { on ? g.unpauseAnimations() : g.pauseAnimations(); } catch (e) {} }); }
function go(i, opts = {}) {
  if (i < 0 || i >= scenes.length) return;
  const prev = scenes[state.i], next = scenes[i], back = i < state.i;
  if (prev !== next) {
    prev.classList.remove('is-active', 'back'); prev.classList.add('is-leaving');
    setTimeout(() => prev.classList.remove('is-leaving'), 780);
    pauseAll(prev); cinesIn(prev).forEach(c => c.leave());
    const hp = hooks[prev.dataset.id]; if (hp && hp.leave) hp.leave(prev);
    next.classList.toggle('back', back);
    void next.offsetWidth;
    next.classList.add('is-active');
    $('.inner', next) && ($('.inner', next).scrollTop = 0);
    if (next.dataset.cut === 'leak' && !reduce) { const l = $('#leak'); l.classList.remove('go'); void l.offsetWidth; l.classList.add('go'); sfx.hit(.16); }
    else sfx.whoosh(.035);
  }
  state.i = i;
  const steps = +(next.dataset.steps || 0);
  setStep(opts.step === 'max' ? steps : (opts.step || 0));
  $$('video[data-auto]', next).forEach(playV);
  cinesIn(next).forEach(c => c.enter());
  const hn = hooks[next.dataset.id]; if (hn && hn.enter && prev !== next) hn.enter(next);
  if (prev === next && hn && hn.enter && !next._entered) hn.enter(next);
  next._entered = true;
  preload(scenes[i + 1]);
  scenes.forEach((sc, k) => { if (Math.abs(k - i) > 1 && sc._loaded) { sc._loaded = false; unloadScene(sc); } });
  next._loaded = true; if (scenes[i + 1]) scenes[i + 1]._loaded = true;
  hintUpdate();
  scenes.forEach(s => svgAnim(s, s === next));
  prefetchFrom(i);
  hud();
  try { history.replaceState(null, '', '#' + next.dataset.id); } catch (e) {}
}
function hud() {
  const s = scenes[state.i], ch = CH[s.dataset.ch];
  document.body.dataset.tone = s.classList.contains('light') ? 'light' : 'dark';
  document.body.dataset.video = s.querySelector('video, [data-cine]') ? '1' : '0';
  $('#where').innerHTML = (ch[0] ? `<em>${ch[0]} ${ch[1]}</em> · ` : '') + s.dataset.title;
  $('#count').textContent = `${state.i + 1} / ${scenes.length}`;
  $$('button', prog).forEach((b, k) => { b.classList.toggle('cur', k === state.i); b.classList.toggle('done', k < state.i); });
}
function next() {
  const sc = scenes[state.i], steps = +(sc.dataset.steps || 0);
  if (state.step < steps) { setStep(state.step + 1); sfx.whoosh(.02); }
  else go(state.i + 1);
}
function prev() {
  if (state.step > 0 && +(scenes[state.i].dataset.steps || 0)) { setStep(state.step - 1); }
  else go(state.i - 1, { step: 'max' });
}

/* ---------------- sound toggle ---------------- */
function setSound(on) {
  state.sound = on;
  const b = $('[data-action="sound"]'); b.setAttribute('aria-pressed', on);
  $('.lbl', b).textContent = on ? 'Ton an' : 'Ton aus';
  $('.w', b).style.display = on ? '' : 'none'; $('.x', b).style.display = on ? 'none' : '';
  if (on) sfx.ensure();
  $$('video').forEach(v => { v.muted = !(on && v.hasAttribute('data-sound')); });
}

/* ---------------- trailer ---------------- */
const SHOTS = DATA.shots;
const tr = { el: $('#trailer'), run: 0, shots: [] };
function trBuild() {
  tr.el.querySelectorAll('.shot').forEach(n => n.remove());
  tr.shots = SHOTS.map(S => {
    const d = document.createElement('div'); d.className = 'shot ' + S.kind;
    if (S.kind === 'single') d.innerHTML = `<img class="bgv" src="${S.poster}" alt=""><video class="fg" muted playsinline preload="auto" data-src="${S.src}" poster="${S.poster}"${S.sound ? ' data-sound' : ''}></video>`;
    if (S.kind === 'tri') d.innerHTML = S.srcs.map(x => `<video muted playsinline preload="auto" data-src="${x[0]}" poster="${x[2]}"></video>`).join('');
    tr.el.insertBefore(d, $('#ttl'));
    $$('video', d).forEach(v => { v._unlocked = true; let p; try { p = v.play(); } catch (e) { p = null; } if (p) p.catch(() => {}); arm(v); });
    return d;
  });
}
function waitEv(el, ev, ms) { return new Promise(res => { let done = false; const f = () => { if (!done) { done = true; res(); } }; el.addEventListener(ev, f, { once: true }); setTimeout(f, ms); }); }
async function prep(k) {
  const S = SHOTS[k], d = tr.shots[k]; if (!d) return;
  const vids = $$('video', d);
  await Promise.all(vids.map(async (v, j) => {
    await arm(v);
    if (v.readyState < 1) { v.muted = true; let p; try { p = v.play(); } catch (e) { p = null; } if (p) await p.catch(() => {}); v.pause(); }
    if (v.readyState < 1) await waitEv(v, 'loadedmetadata', 6000);
    const t = S.kind === 'tri' ? S.srcs[j][1] : S.t;
    try { v.currentTime = t; } catch (e) {}
    await waitEv(v, 'seeked', 2500);
    if (v.readyState < 3) await waitEv(v, 'canplay', 2500);
  }));
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function trailer() {
  closeOverview();
  const run = ++tr.run;
  pauseAll(scenes[state.i]); cinesIn(scenes[state.i]).forEach(c => c.leave());
  tr.el.hidden = false; trBuild(); $('#tr-load').hidden = false; $('#ttl').innerHTML = '';
  $('#tr-snd').textContent = state.sound ? 'Ton aus' : 'Ton an';
  requestAnimationFrame(() => tr.el.classList.add('in'));
  let pending = prep(0);
  for (let k = 0; k < SHOTS.length; k++) {
    await pending; if (run !== tr.run) return;
    $('#tr-load').hidden = true;
    const S = SHOTS[k], d = tr.shots[k];
    tr.shots.forEach((x, j) => { if (j !== k) { x.classList.remove('on'); setTimeout(() => $$('video', x).forEach(v => v.pause()), 500); } });
    d.classList.add('on');
    $$('video', d).forEach(v => { applyRate(v, S.rate || 1); v.muted = !(state.sound && v.hasAttribute('data-sound')); v.play().catch(() => {}); });
    const ttl = $('#ttl');
    if (S.kind === 'title' || S.title) { ttl.innerHTML = `<div class="${S.hold ? 'hold' : 'show'}">${S.text || S.title}</div>`; sfx.hit(S.hold ? .26 : .14); }
    else { ttl.innerHTML = ''; sfx.whoosh(.04); }
    pending = k + 1 < SHOTS.length ? prep(k + 1) : Promise.resolve();
    await sleep(S.dur); if (run !== tr.run) return;
  }
  trEnd(true);
}
function trEnd(toAgenda) {
  tr.run++;
  tr.el.classList.remove('in');
  $$('video', tr.el).forEach(v => { v.pause(); v.removeAttribute('src'); v.load(); });
  tr.el.hidden = true;
  if (toAgenda && state.i === 0) go(1); else go(state.i);
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-action]'), g = e.target.closest('[data-goto]');
  if (g) { closeOverview(); go(ids.indexOf(g.dataset.goto)); return; }
  if (!a) return;
  const act = a.dataset.action;
  if (act === 'next') next();
  else if (act === 'prev') prev();
  else if (act === 'overview') openOverview();
  else if (act === 'overview-close') closeOverview();
  else if (act === 'sound') setSound(!state.sound);
  else if (act === 'fullscreen') toggleFs();
  else if (act === 'trailer') { if (a.closest('#s-start')) setSound(true); trailer(); }
  else if (act === 'trailer-skip') trEnd(true);
  else if (act === 'trailer-sound') { setSound(!state.sound); $('#tr-snd').textContent = state.sound ? 'Ton aus' : 'Ton an'; }
});
function toggleFs() { const d = document; try { if (!d.fullscreenElement) { const p = d.documentElement.requestFullscreen && d.documentElement.requestFullscreen(); if (p) p.catch(() => {}); } else { d.exitFullscreen && d.exitFullscreen().catch(() => {}); } } catch (e) {} }
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target, tag = t.tagName;
  if (!tr.el.hidden) { if (e.key === 'Escape' || e.key === 'ArrowRight') { e.preventDefault(); trEnd(true); } return; }
  if (!$('#overview').hidden) { if (e.key === 'Escape' || e.key === 'o') closeOverview(); return; }
  const inRange = tag === 'INPUT';
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && inRange) return;
  if (e.key === ' ' && (tag === 'BUTTON' || inRange)) return;
  switch (e.key) {
    case 'ArrowRight': case 'PageDown': case ' ': e.preventDefault(); next(); break;
    case 'ArrowLeft': case 'PageUp': e.preventDefault(); prev(); break;
    case 'Home': go(0); break;
    case 'End': go(scenes.length - 1); break;
    case 'o': case 'O': openOverview(); break;
    case 't': case 'T': setSound(!state.sound); break;
    case 'f': case 'F': toggleFs(); break;
    case 'i': case 'I': trailer(); break;
    case 'k': case 'K': { const c = cinesIn(scenes[state.i])[0]; if (c) c.toggle(); break; }
  }
});
// swipe
let sx = null, sy = null, st = 0;
document.addEventListener('touchstart', e => { if (e.target.closest('input, canvas, .cine-scrub')) { sx = null; return; } sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx === null || !tr.el.hidden || !$('#overview').hidden) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && Date.now() - st < 700) { dx < 0 ? next() : prev(); }
  sx = null;
}, { passive: true });
window.addEventListener('hashchange', () => { const k = ids.indexOf(location.hash.slice(1)); if (k >= 0 && k !== state.i) go(k); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { $$('video', scenes[state.i]).forEach(v => v.pause()); } else { $$('video[data-auto]', scenes[state.i]).forEach(playV); cinesIn(scenes[state.i]).forEach(c => c.playing && c.play()); } });
let wake = null;
document.addEventListener('click', () => { if (!wake && navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wake = w; w.addEventListener('release', () => wake = null); }).catch(() => {}); }, { once: false, passive: true });

if (!(document.documentElement.requestFullscreen && document.fullscreenEnabled)) $$('[data-action="fullscreen"]').forEach(b => b.hidden = true);

/* ---------------- grain ---------------- */
(function grain() {
  const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d'); const d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = Math.random() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  x.putImageData(d, 0, 0); $('#grain').style.backgroundImage = `url(${c.toDataURL()})`;
})();

/* ---------------- boot ---------------- */
/* ---------------- background prefetch ---------------- */
let prefetchRun = 0;
function videoPaths(sc) {
  const out = [];
  $$('video[data-src]', sc).forEach(v => out.push(v.dataset.src));
  $$('[data-cine]', sc).forEach(r => { out.push(r.dataset.src); const P = r.dataset.pat && PATTERNS[r.dataset.pat]; if (P && P.slow) out.push(P.slow.src); });
  return out;
}
async function prefetchFrom(i) {
  if (!window.__laAsset) return;                       // offline copy: files are local, nothing to do
  const c = navigator.connection; if (c && c.saveData) return;
  const run = ++prefetchRun;
  const order = [...scenes.slice(i), ...scenes.slice(0, i)];
  const seen = new Set();
  for (const sc of order) for (const p of videoPaths(sc)) {
    if (run !== prefetchRun) return;                   // user moved on: restart from the new scene
    if (seen.has(p)) continue; seen.add(p);
    try { await ASSET(p); } catch (e) {}
  }
}

setSound(false); // browsers need a click before sound; the user turns it on
const startK = Math.max(0, ids.indexOf(location.hash.slice(1)));
state.i = startK; scenes[startK].classList.add('is-active');
go(startK);
}
if (window.__laLock) window.__laLock(boot); else boot();
})();
</script>
